<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Hipermaxi — Dev Widget</title>
    <!-- Bootstrap 3.3.7 replica del portal real -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <style>
      body { padding: 30px; background: #f5f5f5; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-default">
      <div class="container-fluid">
        <div class="navbar-header">
          <span class="navbar-brand">Portal de Proveedores — Hipermaxi (dev)</span>
        </div>
      </div>
    </nav>

    <div class="container">
      <h2>Carga de Factura <small>Prueba de integración</small></h2>
      <div class="panel panel-default">
        <div class="panel-heading">Datos de la Factura</div>
        <div class="panel-body">
          <form>
            <div class="form-group">
              <label for="campo-nro-oc">Número de Orden de Compra</label>
              <input type="text" class="form-control" id="campo-nro-oc" placeholder="Ej: OC-2026-001234">
            </div>
            <div class="form-group">
              <label>Archivo de Factura (PDF)</label>
              <input type="file" accept=".pdf">
            </div>
            <div class="form-group">
              <label>Monto Total (Bs.)</label>
              <input type="number" class="form-control" placeholder="0.00">
            </div>
            <button type="button" class="btn btn-primary" id="btn-confirmar-factura">
              Confirmar y Enviar Factura
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

    <!-- Widget config -->
    <script>
      window.__HX_WIDGET_LEVEL__ = 3;
      window.__HX_WIDGET_WS_URL__ = 'ws://localhost:8765';
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
